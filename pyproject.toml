[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csvdoctor"
version = "0.0.1"
description = "Diagnose and clean CSV files using the standard library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishant Tyagi" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
csvdoctor = "csvdoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
